<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cricket Corner — Free Forecast Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #0b1118;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e8f0e9;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ══════════════════════════════════════════
       LOGO BAR — centered logo only
    ══════════════════════════════════════════ */
    .logo-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      background: rgba(11, 17, 24, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-bar img.logo {
      height: 38px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .logo-bar img.logo.broken {
      display: none;
    }

    /* ══════════════════════════════════════════
       HERO — full background image with
       all content on the RIGHT side
    ══════════════════════════════════════════ */
    .hero {
      position: relative;
      width: 100%;
      min-height: calc(100vh - 62px);
      min-height: calc(100dvh - 62px);
      overflow: hidden;
    }

    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: left center;
      display: block;
    }

    /* Dark overlay — heavier on the right to make content readable */
    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to left,
          rgba(11, 17, 24, 0.93) 0%,
          rgba(11, 17, 24, 0.82) 40%,
          rgba(11, 17, 24, 0.35) 70%,
          rgba(11, 17, 24, 0.15) 100%);
      pointer-events: none;
    }

    /* Content container — sits on the right side */
    .hero-content {
      position: relative;
      z-index: 2;
      min-height: calc(100vh - 62px);
      min-height: calc(100dvh - 62px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      padding: 30px 22px 40px;
    }

    .hero-inner {
      width: 55%;
      min-width: 200px;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Headline ── */
    .hero-headline {
      font-size: clamp(1.6rem, 7vw, 2.4rem);
      font-weight: 900;
      color: #fff;
      line-height: 1.08;
      letter-spacing: -0.02em;
      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.8),
        0 4px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 18px;
    }

    /* ── Progress bar ── */
    .progress-bar-wrap {
      width: 100%;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 9px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 85%;
      border-radius: 10px;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
      transition: width 1s ease;
    }

    .progress-label {
      text-align: center;
      margin-top: 6px;
      margin-bottom: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #8aa894;
    }

    .progress-label strong {
      color: #4ade80;
    }

    /* ── Checklist ── */
    .checklist {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(0.95rem, 4vw, 1.15rem);
      font-weight: 700;
      color: #f0f4f1;
    }

    .check-item .check-icon {
      width: 24px;
      height: 24px;
      background: #22c55e;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.8rem;
      color: #fff;
    }

    /* ── Email input ── */
    .input-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #d0ddd5;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      padding: 14px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 12px;
      -webkit-appearance: none;
      appearance: none;
    }

    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.85rem;
    }

    .input-field:focus {
      border-color: #e8b900;
      box-shadow: 0 0 0 3px rgba(232, 185, 0, 0.15);
    }

    /* ── Yellow CTA Button ── */
    .btn-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 10px;
      background: #f5cc00;
      color: #1a1400;
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.88rem, 4vw, 1.05rem);
      font-weight: 900;
      letter-spacing: 0.03em;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow:
        0 6px 24px rgba(245, 204, 0, 0.3),
        0 2px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      min-height: 52px;
      animation: btn-pulse 2.5s ease-in-out infinite;
    }

    .btn-cta:hover,
    .btn-cta:focus {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow:
        0 10px 32px rgba(245, 204, 0, 0.45),
        0 4px 10px rgba(0, 0, 0, 0.2);
      animation: none;
    }

    .btn-cta:active {
      transform: scale(0.97);
      filter: brightness(0.92);
      animation: none;
    }

    @keyframes btn-pulse {

      0%,
      100% {
        box-shadow:
          0 6px 24px rgba(245, 204, 0, 0.3),
          0 2px 6px rgba(0, 0, 0, 0.2);
      }

      50% {
        box-shadow:
          0 6px 36px rgba(245, 204, 0, 0.55),
          0 2px 6px rgba(0, 0, 0, 0.2);
      }
    }

    /* ══════════════════════════════════════════
       COUNTDOWN & TRUST — below hero
    ══════════════════════════════════════════ */
    .countdown-section {
      text-align: center;
      padding: 28px 22px 8px;
    }

    .countdown-text {
      font-size: clamp(1.25rem, 5.5vw, 1.6rem);
      font-weight: 800;
      color: #fff;
    }

    .countdown-text .timer {
      color: #4ade80;
      font-variant-numeric: tabular-nums;
    }

    .trust-note {
      text-align: center;
      padding: 10px 22px 36px;
      font-size: 0.78rem;
      color: #5a6e60;
      font-weight: 500;
    }

    .trust-note .lock-icon {
      color: #e8b900;
    }

    /* ══════════════════════════════════════════
       RESPONSIVE — wider screens
    ══════════════════════════════════════════ */
    @media (min-width: 480px) {
      .hero-inner {
        max-width: 340px;
      }

      .hero-headline {
        font-size: 2.2rem;
      }
    }

    /* Tablet */
    @media (min-width: 768px) {
      .hero {
        max-width: 800px;
        margin: 0 auto;
        border-radius: 0 0 24px 24px;
        min-height: 600px;
      }

      .hero-img {
        border-radius: 0 0 24px 24px;
      }

      .hero-overlay {
        border-radius: 0 0 24px 24px;
      }

      .hero-content {
        min-height: 600px;
        padding: 40px 48px 50px;
      }

      .hero-inner {
        width: 45%;
        max-width: 360px;
      }

      .countdown-section,
      .trust-note {
        max-width: 800px;
        margin-left: auto;
        margin-right: auto;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .hero {
        max-width: 900px;
        margin: 20px auto 0;
        border-radius: 24px;
        min-height: 620px;
      }

      .hero-img {
        border-radius: 24px;
      }

      .hero-overlay {
        border-radius: 24px;
      }

      .hero-content {
        min-height: 620px;
        padding: 50px 60px 50px;
      }

      .hero-inner {
        width: 42%;
        max-width: 380px;
      }

      .hero-headline {
        font-size: 2.5rem;
      }

      .countdown-section,
      .trust-note {
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
      }
    }

    /* Safe area for notched phones */
    @supports (padding: env(safe-area-inset-bottom)) {
      .trust-note {
        padding-bottom: calc(36px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>

<body>
  <!-- ── Logo Bar (centered, no text) ── -->
  <div class="logo-bar">
    <img class="logo" src="logo.png" alt="Cricket Corner" onerror="this.style.display='none'" />
  </div>

  <!-- ── Hero — image background with all content on the right ── -->
  <div class="hero">
    <img class="hero-img" src="img.jpg" alt="Cricket Match Insights" />
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <div class="hero-inner">

        <!-- Headline -->
        <h1 class="hero-headline">WIN TONIGHT,<br>OR MISS OUT</h1>

        <!-- Progress Bar -->
        <div class="progress-bar-wrap">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
          </div>
          <p class="progress-label"><strong id="progressPct">85%</strong> Slots Taken</p>
        </div>

        <!-- Checklist -->
        <div class="checklist">
          <div class="check-item">
            <div class="check-icon">✓</div>
            Winning Odds
          </div>
          <div class="check-item">
            <div class="check-icon">✓</div>
            Fast Alerts
          </div>
          <div class="check-item">
            <div class="check-icon">✓</div>
            Exclusive Data
          </div>
        </div>

        <!-- Email + CTA -->
        <input type="email" id="contactInput" class="input-field" placeholder="Enter your email address..."
          autocomplete="off" inputmode="email" />
        <button class="btn-cta" id="ctaBtn" onclick="handleCTA()">
          CLAIM YOUR SPOT NOW!
        </button>

      </div>
    </div>
  </div>

  <!-- ── Countdown ── -->
  <div class="countdown-section">
    <p class="countdown-text">Access expires in <span class="timer" id="countdown">04:59</span></p>
  </div>

  <!-- ── Trust ── -->
  <p class="trust-note"><span class="lock-icon">🔒</span> 100% Secure &amp; Data Private</p>

  <script>
    /* ── Countdown Timer ── */
    let totalSeconds = 4 * 60 + 59;
    const countdownEl = document.getElementById('countdown');

    function updateCountdown() {
      if (totalSeconds <= 0) {
        countdownEl.textContent = '00:00';
        return;
      }
      totalSeconds--;
      const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      const s = (totalSeconds % 60).toString().padStart(2, '0');
      countdownEl.textContent = m + ':' + s;
    }

    setInterval(updateCountdown, 1000);

    /* ── Progress bar subtle animation ── */
    const progressFill = document.getElementById('progressFill');
    const progressPct = document.getElementById('progressPct');
    let pct = 85;

    setInterval(() => {
      if (pct < 94) {
        pct++;
        progressFill.style.width = pct + '%';
        progressPct.textContent = pct + '%';
      }
    }, 12000);

    /* ── CTA Logic ── */
    const ctaBtn = document.getElementById('ctaBtn');
    const API_BASE = 'https://fb-lander.onrender.com';

    async function handleCTA() {
      const input = document.getElementById('contactInput');
      const val = input.value.trim();

      if (!val) {
        input.focus();
        input.style.borderColor = '#e8b900';
        input.style.boxShadow = '0 0 0 3px rgba(232,185,0,0.25)';
        setTimeout(() => { input.style.borderColor = ''; input.style.boxShadow = ''; }, 1800);
        return;
      }

      ctaBtn.disabled = true;
      ctaBtn.style.opacity = '0.7';
      ctaBtn.style.animation = 'none';
      ctaBtn.textContent = 'Sending…';

      try {
        const res = await fetch(API_BASE + '/api/leads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contact: val, contactType: 'email' }),
        });
        const data = await res.json();

        if (data.success) {
          ctaBtn.style.background = '#22c55e';
          ctaBtn.style.opacity = '1';
          ctaBtn.style.color = '#fff';
          ctaBtn.textContent = "✅ You're In! We'll reach you shortly.";
          input.value = '';
          input.disabled = true;
          input.placeholder = 'Submission received — thank you!';
        } else {
          ctaBtn.disabled = false;
          ctaBtn.style.opacity = '1';
          ctaBtn.textContent = '⚠️ ' + data.message + ' — Try Again';
          setTimeout(resetBtn, 3000);
        }
      } catch (err) {
        ctaBtn.disabled = false;
        ctaBtn.style.opacity = '1';
        ctaBtn.textContent = '⚠️ Network error — Try Again';
        setTimeout(resetBtn, 3000);
      }
    }

    function resetBtn() {
      ctaBtn.disabled = false;
      ctaBtn.style.opacity = '1';
      ctaBtn.style.background = '';
      ctaBtn.style.color = '';
      ctaBtn.style.animation = 'btn-pulse 2.5s ease-in-out infinite';
      ctaBtn.textContent = 'CLAIM YOUR SPOT NOW!';
    }

    document.getElementById('contactInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') handleCTA();
    });
  </script>
</body>

</html>
